name: Apply SAP Word evidence payload

on:
  push:
    branches:
      - docs/sap-word-screenshots-2026-09-03
    paths:
      - .tmp/F600_READY

permissions:
  contents: write

jobs:
  apply-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/sap-word-screenshots-2026-09-03
          fetch-depth: 0

      - name: Restore supplied Word screenshots
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/f600/chunk_* | tr -d '\n' | base64 --decode > /tmp/sap-evidence-payload.tar.gz
          echo '58a1fbf81ddffd11b7014b1ba1ed3f24363b1b4883f7eccd277c314d985d3871  /tmp/sap-evidence-payload.tar.gz' | sha256sum -c -

          rm -f showcases/sap-integration-lab/visual-evidence/mm01-material-extension/mm01-result.webp
          rm -f showcases/sap-integration-lab/01-ecc/isu/work-management/number-range-governance/evidence/range-final.webp
          rm -f showcases/sap-integration-lab/01-ecc/isu/work-management/number-range-governance/evidence/rsnumhot-monitor.webp
          rm -f showcases/sap-integration-lab/01-ecc/isu/work-management/seals-material-enablement/evidence/mmpv-test-period.webp

          tar -xzf /tmp/sap-evidence-payload.tar.gz -C .
          manifest='showcases/sap-integration-lab/.word-evidence-manifest.txt'
          test -f "$manifest"
          expected=59
          actual=$(wc -l < "$manifest" | tr -d ' ')
          test "$actual" -eq "$expected"

          while IFS= read -r path; do
            test -s "$path"
            file "$path" | grep -qi 'Web/P image\|WebP'
          done < "$manifest"

          rm -f "$manifest"
          rm -rf .tmp .sap-evidence-write-ok
          rm -f .github/workflows/apply-sap-word-evidence.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(sap): restore supplied Word guide screenshots"
          git push origin HEAD:docs/sap-word-screenshots-2026-09-03
