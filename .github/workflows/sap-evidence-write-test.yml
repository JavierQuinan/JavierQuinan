name: SAP evidence write-path test

on:
  push:
    branches:
      - docs/sap-word-screenshots-2026-09-03
    paths:
      - .github/workflows/sap-evidence-write-test.yml

permissions:
  contents: write

jobs:
  verify-write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/sap-word-screenshots-2026-09-03
      - name: Verify branch write permission
        shell: bash
        run: |
          set -euo pipefail
          printf 'ok\n' > .sap-evidence-write-ok
          rm .github/workflows/sap-evidence-write-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: confirm SAP evidence branch write access"
          git push origin HEAD:docs/sap-word-screenshots-2026-09-03
