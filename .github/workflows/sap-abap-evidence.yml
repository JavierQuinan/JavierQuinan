name: Validate SAP ABAP Evidence

on:
  pull_request:
    paths:
      - 'showcases/sap-integration-lab/**'
      - '.github/workflows/sap-abap-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'showcases/sap-integration-lab/**'
      - '.github/workflows/sap-abap-evidence.yml'

jobs:
  evidence-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate curated ABAP evidence
        shell: bash
        run: |
          set -euo pipefail
          root='showcases/sap-integration-lab/04-abap-labs'
          sap_root='showcases/sap-integration-lab'

          test -f "$root/README.md"
          test -f "$root/README.es.md"
          test -f "$root/EVIDENCE_MATRIX.md"
          test -f "$root/EVIDENCE_MATRIX.es.md"
          test ! -d "$root/runtime-readiness"

          source_count=$(find "$root/labs/source" -maxdepth 1 -type f -name '*.abap' | wc -l | tr -d ' ')
          test "$source_count" = '10'

          image_count=$(find "$root/labs" -path '*/assets/*' -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' \) | wc -l | tr -d ' ')
          test "$image_count" = '20'

          if find "$sap_root" -type f \( -iname '*.pdf' -o -iname '*.docx' \) | grep -q .; then
            echo 'Raw PDF/DOCX material detected in public SAP evidence.' >&2
            exit 1
          fi

          if grep -RniEi --include='*.md' --include='*.abap' \
            '\b(future|futuro|roadmap)\b|runtime-readiness|OPTIONAL_FUTURE_EXPANSION|NOT_YET_EVIDENCED|NEEDS_ADT_VERIFICATION|CURRENT_RUNTIME_VERIFICATION' "$sap_root"; then
            echo 'Planning/promise framing detected in the public SAP evidence track.' >&2
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path('showcases/sap-integration-lab/04-abap-labs')
          sap_root = Path('showcases/sap-integration-lab')
          missing = []

          # Targeted secret scan: generic documentation words are allowed; actual-looking
          # assigned values and bearer/private-key material are not.
          text_suffixes = {'.md', '.abap', '.ts', '.js', '.json', '.yml', '.yaml', '.txt'}
          safe_tokens = {'test', 'example', 'dummy', 'mock', 'placeholder', 'fake', 'redacted', 'sample', '***', '<redacted>', '<placeholder>'}
          assignment = re.compile(
              r'(?i)(clientsecret|client_secret|clientid|client_id|subaccountid|api[_-]?key|password)'
              r'\s*["\']?\s*[:=]\s*["\']([^"\'\s,}]+)'
          )
          bearer = re.compile(r'(?i)\bBearer\s+([A-Za-z0-9._-]+)')
          private_key = re.compile(r'BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY')

          for path in sap_root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in text_suffixes:
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              if private_key.search(text):
                  missing.append(f'Private-key material detected: {path}')
              for match in bearer.finditer(text):
                  token = match.group(1).lower()
                  if not any(marker in token for marker in safe_tokens):
                      missing.append(f'Bearer token-like value detected: {path}')
              for match in assignment.finditer(text):
                  value = match.group(2).strip().lower()
                  if value and not any(marker in value for marker in safe_tokens):
                      missing.append(f'Secret-like assigned value detected: {path}: {match.group(1)}')

          for md in sap_root.rglob('*.md'):
              text = md.read_text(encoding='utf-8')
              for target in re.findall(r'\[[^\]]+\]\(([^)]+)\)', text):
                  if target.startswith(('http://', 'https://', '#', 'mailto:')):
                      continue
                  target = target.split('#', 1)[0]
                  if not target:
                      continue
                  resolved = (md.parent / target).resolve()
                  if not resolved.exists():
                      missing.append(f'{md}: {target}')

          required_pairs = [
              root / 'README.md',
              root / 'EVIDENCE_MATRIX.md',
              root / 'NAMING_CONVENTIONS.md',
              root / 'labs/README.md',
              root / 'guides/ABAPGIT_WORKFLOW_GUIDE.md',
              root / 'guides/ABAP_CLEANER_GUIDE.md',
              root / 'guides/ABAP_CLOUD_DICTIONARY_GUIDE.md',
              root / 'guides/ATC_IMPLEMENTATION_GUIDE.md',
              root / 'guides/AUTHORIZATIONS_GUIDE.md',
          ]
          for en in required_pairs:
              es = en.with_name(en.stem + '.es.md')
              if not es.exists():
                  missing.append(f'Missing Spanish pair for {en}')

          lab_dirs = sorted(p for p in (root / 'labs').iterdir() if p.is_dir() and p.name.startswith('lab-'))
          if len(lab_dirs) != 10:
              missing.append(f'Expected 10 public hands-on lab folders, found {len(lab_dirs)}')
          for lab_dir in lab_dirs:
              en = lab_dir / 'README.md'
              es = lab_dir / 'README.es.md'
              if not en.exists():
                  missing.append(f'Missing {en}')
              if not es.exists():
                  missing.append(f'Missing {es}')

          settings = json.loads(Path('.claude/settings.json').read_text(encoding='utf-8'))
          expected = {'attribution': {'commit': '', 'pr': ''}}
          if settings != expected:
              missing.append('.claude/settings.json attribution policy changed')

          if missing:
              raise SystemExit('\n'.join(missing))
          PY
